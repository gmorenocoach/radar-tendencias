name: Radar nocturno

on:
  schedule:
    - cron: "17 8 * * *"      # 03:17 Bogotá (UTC-5), todos los días
  workflow_dispatch:
    inputs:
      perfil:
        description: "ID de perfil (vacío = todos)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Ejecutar radar
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python radar.py ${{ github.event.inputs.perfil }}

      - name: Analizar miniaturas virales
        run: python -m fabrica.miniaturas_analisis || true

      - name: Oportunidades (lo que pregunta la gente en comentarios) — lunes y jueves
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          d=$(TZ=America/Bogota date +%u)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$d" = "1" ] || [ "$d" = "4" ]; then python -m fabrica.oportunidades --todos || true; else echo "hoy no toca"; fi

      - name: Informe de competencia por canal — domingos
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          d=$(TZ=America/Bogota date +%u)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$d" = "7" ]; then python -m fabrica.competencia --todos || true; else echo "hoy no toca"; fi

      - name: Guardar resultados
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && echo "sin cambios" || git commit -m "radar: datos $(date -u +%F)"
          git pull --rebase --autostash origin main
          git push
