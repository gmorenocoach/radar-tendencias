name: Auditar canales propios

on:
  workflow_dispatch:
    inputs:
      handles:
        description: "Handles separados por coma"
        required: true
        default: "@equilibrateGM,@soyintegralsas,@BaristadelSer"

permissions:
  contents: write

jobs:
  auditar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - name: Auditar
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python -m fabrica.auditoria --handles "${{ github.event.inputs.handles }}"
      - name: Guardar
        run: |
          git config user.name "radar-bot"; git config user.email "radar-bot@users.noreply.github.com"
          git add data/auditoria_*.json && (git diff --cached --quiet || git commit -m "auditoría de canales") && git pull --rebase origin main && git push
