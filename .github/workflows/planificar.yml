name: Planificar canal

on:
  workflow_dispatch:
    inputs:
      perfil:
        description: "Perfil"
        required: true
        type: choice
        options: [equilibrate_es, soyintegral_es, mitribu_es, barista_es]
      desde:
        description: "Desde (AAAA-MM-DD, vacío = del plan)"
        required: false
        default: ""
      hasta:
        description: "Hasta (AAAA-MM-DD, vacío = del plan)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  planificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m fabrica.planificar --perfil ${{ github.event.inputs.perfil }} --desde "${{ github.event.inputs.desde }}" --hasta "${{ github.event.inputs.hasta }}"
      - run: |
          git config user.name "fabrica-bot"; git config user.email "fabrica-bot@users.noreply.github.com"
          P=planes/${{ github.event.inputs.perfil }}.json
          git add "$P" config/historias.json 2>/dev/null; git commit -m "plan: ${{ github.event.inputs.perfil }}" || true
          git checkout -- planes/index.json 2>/dev/null || true
          git pull --rebase origin main
          python - <<'EOF2'
          import json, pathlib
          P = pathlib.Path("planes"); idx = {"planes": [json.loads(f.read_text()) | {"piezas": None, "series": None} for f in sorted(P.glob("*.json")) if f.name != "index.json"]}
          (P / "index.json").write_text(json.dumps(idx, ensure_ascii=False, indent=1))
          EOF2
          git add planes/index.json && (git diff --cached --quiet || git commit -m "índice de planes")
          git push || (git pull --rebase -X theirs origin main && git push)
